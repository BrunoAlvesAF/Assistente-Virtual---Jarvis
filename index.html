<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - assistent virtual</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="./src/cliente/imagens/avatar.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/cliente/style.css">
    <link rel="stylesheet" href= "./src/cliente/sky.css">
</head>
<body>
   <section class="main">
     <div class="image-container">
        <div class="image">
           <img src="./src/cliente/imagens/giphy.gif" alt="image">
        </div>
        <h1>J A R V I S</h1>
        <p>  Sou seu assistent virtual, JARVIS. como posso ajudá-lo?</p>
     </div>
     <div class="input">
         <button class="talk"><i class="fas fa-microphone-alt"></i></button>
         <h1 class="content">Clique aqui para falar</h1> 
     </div>
   </section>


<!--Clima-->
   <div id="container">
      <form id="search">
          <i  class="fa-solid fa-location-dot"></i>
          <input 
              type="search" 
              name="city_name" 
              id="city_name" 
              placeholder="Buscar Cidade"
          >
          <button type="submit">
              <i class="fa-solid fa-magnifying-glass"></i>
          </button>
      </form>

      <div id="weather">
          <h1 id="title">Mucambo, BR</h1>

          <div id="infos">
              <div id="temp">
                  <img id="temp_img" src="http://openweathermap.org/img/wn/04d@2x.png" alt="">
                  
                  <div>
                      <p id="temp_value">
                          32 
                      </p>
                      <p id="temp_description">
                          Ensolarado
                      </p>
                  </div>
              </div>

              <div id="other_infos">
                  <div class="info">
                      <i id="temp_max_icon" class="fa-solid fa-temperature-high"></i>

                      <div>
                          <h2>Temp. max</h2>

                          <p id="temp_max">
                              32 <sup>C°</sup>
                          </p>
                      </div>
                  </div>

                  <div class="info">
                      <i id="temp_min_icon" class="fa-solid fa-temperature-low"></i>

                      <div>
                          <h2>Temp. min</h2>

                          <p id="temp_min">
                              12 <sup>C°</sup>
                          </p>
                      </div>
                  </div>

                  <div class="info">
                      <i id="humidity_icon" class="fa-solid fa-droplet"></i>

                      <div>
                          <h2>Humidade</h2>

                          <p id="humidity">
                              50%
                          </p>
                      </div>
                  </div>

                  <div class="info">
                      <i id="wind_icon" class="fa-solid fa-wind"></i>

                      <div>
                          <h2>Vento</h2>

                          <p id="wind">
                              50 km/h
                          </p>
                      </div>
                  </div>
              </div>
          </div>
      </div>

      <div id="alert"></div>

</div>
   <script src="./src/cliente/script.js"></script>
   <script src="./src/cliente/sky.js"></script>
</body>
</html>
